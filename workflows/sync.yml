name: Sync repo data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: ["config/repos.json", "scripts/sync_repos.py"]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch repo data
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: python scripts/sync_repos.py
      - name: Commit changes
        run: |
          git config user.name "mmt-hub-bot"
          git config user.email "mmt-hub-bot@users.noreply.github.com"
          git add data/repos.json
          git diff --cached --quiet || (git commit -m "Update repo data" && git push)
